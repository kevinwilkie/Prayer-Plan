<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3f7d4f" id="theme-color-meta" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Prayer Plan" />
  <title>Personal Prayer Plan</title>
  <script>
    /* Apply the saved palette + liturgical season before paint (no flash). */
    (function () {
      try {
        var s = localStorage.getItem("prayerPlan.style");
        var style = /^(sanctuary|candlelight|night)$/.test(s || "") ? s : "sanctuary";
        document.documentElement.setAttribute("data-style", style);
        document.documentElement.setAttribute("data-season", litSeason(new Date()));
        var skipped = localStorage.getItem("prayerPlan.gate") === "off";
        var authed = localStorage.getItem("prayerPlan.authed") === "1";
        if (!skipped && !authed) document.documentElement.classList.add("show-gate");
      } catch (e) {}
      /* Compact Western/Roman liturgical-season calc (mirrors app.js). */
      function litSeason(t) {
        function ymd(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
        function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return ymd(r); }
        function easter(y) {
          var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
            f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
            h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
            l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
            mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
          return new Date(y, mo - 1, da);
        }
        function advent(y) { var d = new Date(y, 10, 30), dow = d.getDay(); return addDays(d, dow <= 3 ? -dow : 7 - dow); }
        var day = ymd(t), Y = day.getFullYear(), E = ymd(easter(Y)),
          ash = addDays(E, -46), pent = addDays(E, 49), adv = advent(Y),
          xmas = new Date(Y, 11, 25), epi = new Date(Y, 0, 6);
        if (day <= epi) return "christmas";
        if (day >= ash && day < E) return "lent";
        if (day.getTime() === pent.getTime()) return "pentecost";
        if (day >= E && day < pent) return "easter";
        if (day >= adv && day < xmas) return "advent";
        if (day >= xmas) return "christmas";
        return "ordinary";
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=37" />
</head>
<body>
  <!-- WELCOME / SIGN-IN (shown before the app when signed out; sync.js fills the form) -->
  <div id="auth-gate" class="auth-gate">
    <div class="welcome">
      <!-- App mark: swap the glyph here (or an <img>) to change it everywhere on this screen. -->
      <div class="welcome-mark" aria-hidden="true">&#10013;</div>
      <div class="eyebrow welcome-eyebrow">Prayer Plan</div>
      <h1 class="welcome-title">A daily rhythm of prayer.</h1>
      <p class="welcome-body">Adoration, Confession, Thanksgiving, Supplication. Drawn fresh each day from what you're praying through.</p>
      <div id="auth-gate-body" class="welcome-form"></div>
      <div class="welcome-foot">
        <button type="button" id="gate-skip" class="welcome-skip">Continue without an account</button>
        <p class="welcome-note">Your plan stays on this device. Sign in later to sync.</p>
      </div>
    </div>
  </div>

  <div class="app">
    <!-- TODAY: overview, guided session, done -->
    <main id="view-today" class="screen is-active" data-view="today">
      <div id="today-overview" class="today-overview">
        <header class="today-header">
          <div class="th-top">
            <span class="th-season" id="th-season"></span>
            <span class="th-next" id="th-next"></span>
          </div>
          <div class="th-daterow">
            <button type="button" class="th-arrow" id="prev-day" aria-label="Previous day"><span aria-hidden="true">&#8249;</span></button>
            <h1 class="th-date" id="th-date"></h1>
            <button type="button" class="th-arrow" id="next-day" aria-label="Next day"><span aria-hidden="true">&#8250;</span></button>
          </div>
          <div class="th-jump" id="th-jump"></div>
          <div class="th-progress" id="th-progress" aria-label="Today's progress"></div>
        </header>
        <section id="today-content" class="today-rows" aria-live="polite"></section>
        <div class="continue-wrap" id="continue-wrap"></div>
      </div>
      <div id="today-session" class="session" hidden></div>
    </main>

    <!-- LIBRARY (was Banks + Prayer Cards): bank lists, prayer card detail -->
    <main id="view-library" class="screen" data-view="library">
      <div id="lib-list">
        <div class="screen-head">
          <div class="eyebrow">Library</div>
          <h1 class="screen-sub">What you pray through</h1>
        </div>
        <div class="lib-chips" id="bank-tab-chips" role="tablist" aria-label="Banks"></div>
        <div id="lib-rotation"></div>
        <section id="bank-content" class="lib-rows"></section>
        <button type="button" class="fab" id="lib-fab">+ Add</button>
      </div>
      <section id="lib-card" class="lib-card" hidden></section>
    </main>

    <!-- JOURNAL (was Answered): answered prayers + daily notes -->
    <main id="view-journal" class="screen" data-view="journal">
      <div class="screen-head">
        <div class="eyebrow">Journal</div>
        <h1 class="screen-sub">A record of faithfulness</h1>
      </div>
      <div class="seg" id="journal-seg" role="tablist" aria-label="Journal"></div>
      <section id="journal-content" class="journal-list"></section>
    </main>

    <!-- MORE: account, theme, daily draw, reference sub-screens -->
    <main id="view-more" class="screen" data-view="more">
      <div id="more-main">
        <div class="screen-head">
          <div class="eyebrow">More</div>
          <h1 class="screen-sub">Settings &amp; reference</h1>
        </div>
        <div class="more-body">
          <section id="account-box"></section>
          <div id="more-content" class="more-stack"></div>
        </div>
      </div>
      <section id="more-sub" class="more-sub" hidden></section>
    </main>

    <!-- BOTTOM TAB BAR -->
    <nav class="tabbar" aria-label="Views" role="tablist">
      <button type="button" class="tab is-active" data-view="today"><span class="tab-dot"></span><span class="tab-label">Today</span></button>
      <button type="button" class="tab" data-view="library"><span class="tab-dot"></span><span class="tab-label">Library</span></button>
      <button type="button" class="tab" data-view="journal"><span class="tab-dot"></span><span class="tab-label">Journal</span></button>
      <button type="button" class="tab" data-view="more"><span class="tab-dot"></span><span class="tab-label">More</span></button>
    </nav>
  </div>

  <!-- Bottom sheet (Library add / edit) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-scrim" id="sheet-scrim"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-panel"></div>
  </div>

  <!-- Order matters: config + firebase, then content, app, then sync. -->
  <script src="config.js?v=37"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="data.js?v=37"></script>
  <script src="app.js?v=37"></script>
  <script src="sync.js?v=37"></script>
  <script>
    /* Register the service worker for offline / installable use. */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
